name: Build PB X Store Admin APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Publish Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android SDK & Accept Licenses
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true

      - name: Install dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Generate & Sync Capacitor Android Project
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android
          node scripts/prepare-android.mjs

      - name: Build Installable Android APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare Final APK Asset
        run: |
          APK_SOURCE="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_SOURCE" ]; then
            echo "APK not found at $APK_SOURCE"
            exit 1
          fi
          cp "$APK_SOURCE" "PB-X-Store-Control-Center.apk"
          ls -lh PB-X-Store-Control-Center.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PB-X-Store-Control-Center-APK-build-${{ github.run_number }}
          path: PB-X-Store-Control-Center.apk
          retention-days: 90

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v1.0.${{ github.run_number }}
          name: PB X Store Admin v1.0.${{ github.run_number }}
          body: |
            Automated Android APK build for **PB X Store Control Center**.

            ### How to Install
            1. Download **PB-X-Store-Control-Center.apk** below.
            2. Open the downloaded file on your Android device and tap **Install**.
          files: PB-X-Store-Control-Center.apk
          draft: false
          prerelease: false
