name: Build PB X Store Admin APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Publish Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Android SDK & Accept Licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "Using Android SDK at: $SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1)"
          fi
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          if [ -n "$SDKMANAGER" ] && [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-36" || true
          fi

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Web Assets
        run: npm run build

      - name: Generate & Sync Capacitor Android Project
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android
          node scripts/prepare-android.mjs
          printf "sdk.dir=%s\n" "$ANDROID_HOME" > android/local.properties

      - name: Build Installable Android APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare Final APK Asset
        run: |
          APK_SOURCE="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_SOURCE" ]; then
            echo "APK not found at $APK_SOURCE"
            exit 1
          fi
          cp "$APK_SOURCE" "PB-X-Store-Control-Center.apk"
          ls -lh PB-X-Store-Control-Center.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v7
        with:
          name: PB-X-Store-Control-Center-APK-build-${{ github.run_number }}
          path: PB-X-Store-Control-Center.apk
          retention-days: 90

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: apk-v1.0.${{ github.run_number }}
          name: PB X Store Admin v1.0.${{ github.run_number }}
          body: |
            Automated Android APK build for **PB X Store Control Center**.

            ### How to Install
            1. Download **PB-X-Store-Control-Center.apk** below.
            2. Open the downloaded file on your Android device and tap **Install**.
          files: PB-X-Store-Control-Center.apk
          draft: false
          prerelease: false
